<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - StoreOps CRM</title>
    <!-- Main CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <!-- Full Width 2-Column Split Screen Login Layout -->
    <div class="login-wrapper">
      <!-- Smooth Full-Width Bottom Yellow Ambient Glow Sweep -->
      <div class="ambient-yellow-glow"></div>

      <!-- LEFT COLUMN: Ambient Warm Glow Form Panel -->
      <div class="login-form-col">
        <!-- Top Left Branding -->
        <div class="login-brand-header">
          <a href="index.html" class="login-brand-link">
            <img
              src="assets/images/storelogo.webp"
              alt="StoreOps Logo"
              class="login-logo-img"
            />
          </a>
        </div>

        <!-- Perfectly Centered Form Block -->
        <div class="login-form-center-wrapper">
          <div class="login-form-container">
            <!-- Hero Form Titles -->
            <div class="login-title-box">
              <h1 class="login-title">Sign in to StoreOps</h1>
              <p class="login-subtitle">
                Enter your credentials to access your operations dashboard
              </p>
            </div>

            <!-- Authentication Form -->
            <form id="storeopsLoginForm" class="login-form">
              <!-- Username / Email Field -->
              <div class="form-input-group">
                <label for="loginEmail" class="form-input-label"
                  >Email or Username</label
                >
                <div class="input-pill-wrapper">
                  <input
                    type="email"
                    id="loginEmail"
                    class="input-pill"
                    placeholder="admin@storeops.com"
                    required
                    value="admin@storeops.com"
                  />
                </div>
              </div>

              <!-- Password Field with Toggle Eye Icon -->
              <div class="form-input-group">
                <label for="loginPassword" class="form-input-label"
                  >Password</label
                >
                <div class="input-pill-wrapper password-pill-wrapper">
                  <input
                    type="password"
                    id="loginPassword"
                    class="input-pill"
                    placeholder="••••••••••••"
                    required
                    value="storeops2026"
                  />
                  <button
                    type="button"
                    id="passwordToggleBtn"
                    class="password-eye-btn"
                    title="Toggle password visibility"
                  >
                    <svg
                      id="eyeIcon"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                      ></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Yellow Gradient Main Submit Action Button -->
              <button
                type="submit"
                id="loginSubmitBtn"
                class="login-btn-yellow"
              >
                Sign In to Dashboard
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN: Pure Hero Visual Showcase Panel -->
      <div class="login-hero-col">
        <div class="hero-card-container">
          <!-- Pure High-Res Showcase Image -->
          <img
            src="assets/images/login_hero.jpg"
            alt="StoreOps Field Operations Team"
            class="hero-bg-img"
          />
        </div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Main JavaScript File -->
    <script src="js/app.js"></script>
  </body>
</html>
